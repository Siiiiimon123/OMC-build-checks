name: Preview23 isolated Mac17 manual upgrade
'on':
  push:
    branches: ['verify-optimization20']
    paths: ['isolated23/**', '.github/workflows/isolated23-mac-upgrade.yml']
permissions: {contents: read, actions: read}
jobs:
  isolated-upgrade:
    if: github.repository == 'Siiiiimon123/OMC-build-checks' && github.event.repository.private == false && github.run_attempt == 1
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24.19.0', architecture: arm64, check-latest: false, package-manager-cache: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12.10', architecture: arm64, check-latest: false}
      - name: Parse bounded migration controller
        run: |
          python -c "import ast,pathlib; ast.parse(pathlib.Path('isolated23/run.py').read_bytes())"
          node --check isolated23/normal-cdp.mjs
          node --check isolated23/payload-upgrade.mjs
      - name: Authenticate immutable packages and verify same-profile migration
        env:
          OMC_PREVIEW15_TRANSPORT_KEY: '${{ secrets.OMC_PREVIEW15_TRANSPORT_KEY }}'
          GH_TOKEN: '${{ github.token }}'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python isolated23/run.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: isolated23-mac-upgrade-encrypted-evidence
          path: |
            ${{ runner.temp }}/omc23-isolated-upgrade/encrypted/reports.enc
            ${{ runner.temp }}/omc23-isolated-upgrade/encrypted/REPORTS_READY.json
          retention-days: 7
          if-no-files-found: warn
