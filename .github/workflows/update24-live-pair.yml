name: Verify the public Preview24 update route
'on':
  push:
    branches: ['verify-update24-live-pair']
    paths: ['update24/verify-live-pair.cjs', '.github/workflows/update24-live-pair.yml']
permissions: {contents: read}
jobs:
  public-route:
    if: github.repository == 'Siiiiimon123/OMC-build-checks' && github.event.repository.private == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1}
      - name: Verify both public package URLs
        run: node update24/verify-live-pair.cjs pre
      - name: Read the live signed release pair
        run: node update24/verify-live-pair.cjs wait
