name: Retain accepted Mac19 encrypted package in bounded chunks
'on':
  push:
    branches: ['verify-final-package19']
    paths: ['.github/workflows/relay-mac-package19.yml', 'relay19/**']
permissions: {contents: read, actions: read}
concurrency: {group: omc-mac19-cipher-transfer, cancel-in-progress: false}
jobs:
  transfer:
    if: github.repository == 'Siiiiimon123/OMC-build-checks' && github.event.repository.private == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24.19.0', check-latest: false, package-manager-cache: false}
      - name: Split existing authenticated ciphertext without decryption or rebuild
        env: {GH_TOKEN: '${{ github.token }}'}
        run: node relay19/relay-mac-package19-v2.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mac19-existing-cipher-index
          path: '${{ runner.temp }}/omc-mac19-cipher-transfer/INDEX.json'
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mac19-existing-cipher-part-0
          path: '${{ runner.temp }}/omc-mac19-cipher-transfer/part-000.bin'
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mac19-existing-cipher-part-1
          path: '${{ runner.temp }}/omc-mac19-cipher-transfer/part-001.bin'
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mac19-existing-cipher-part-2
          path: '${{ runner.temp }}/omc-mac19-cipher-transfer/part-002.bin'
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mac19-existing-cipher-part-3
          path: '${{ runner.temp }}/omc-mac19-cipher-transfer/part-003.bin'
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
