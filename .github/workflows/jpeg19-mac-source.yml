name: Mac19 cloud JPEG source acceptance
'on':
  push:
    branches: ['verify-jpeg19-mac']
    paths: ['.github/workflows/jpeg19-mac-source.yml', 'jpeg19-source/**']
permissions: {contents: read}
concurrency: {group: omc-jpeg19-mac-source, cancel-in-progress: false}
jobs:
  native:
    if: github.repository == 'Siiiiimon123/OMC-build-checks' && github.event.repository.private == false && github.run_attempt == 1
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24.19.0', architecture: arm64, check-latest: false, package-manager-cache: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12.10', architecture: arm64, check-latest: false}
      - name: Validate shared cloud harness first
        run: |
          node --check jpeg19-source/cloud-jpeg.mjs
          node jpeg19-source/cloud-preflight.mjs
      - name: Source and authorized JPEG acceptance on Apple Silicon VM
        env:
          OMC_PREVIEW15_TRANSPORT_KEY: '${{ secrets.OMC_PREVIEW15_TRANSPORT_KEY }}'
          PYTHONDONTWRITEBYTECODE: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: python3 jpeg19-source/run-jpeg-cloud.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: jpeg19-mac-encrypted-evidence
          path: '${{ runner.temp }}/omc-jpeg19-cloud/encrypted/*'
          retention-days: 3
          if-no-files-found: warn
