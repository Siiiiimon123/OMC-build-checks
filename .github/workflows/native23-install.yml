name: Preview23 frontend endpoint repair, real installation and mixed thousand
'on':
  push:
    branches: ['verify-optimization20']
    paths: ['native23/**', '.github/workflows/native23-install.yml']
permissions: {contents: read, actions: read}
jobs:
  delivery:
    if: github.repository == 'Siiiiimon123/OMC-build-checks' && github.event.repository.private == false && github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, arch: x64}
          - {os: macos-15, arch: arm64}
    concurrency: {group: 'omc-delivery23-${{ matrix.os }}', cancel-in-progress: false}
    runs-on: '${{ matrix.os }}'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24.19.0', architecture: '${{ matrix.arch }}', check-latest: false, package-manager-cache: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12.10', architecture: '${{ matrix.arch }}', check-latest: false}
      - name: Parse exact controls before downloads
        run: python -c "import ast,pathlib,subprocess; p=pathlib.Path('native23'); [ast.parse(f.read_text(encoding='utf8')) for f in p.glob('*.py')]; [subprocess.run(['node','--check',str(f)],check=True) for f in list(p.glob('*.cjs'))+list(p.glob('*.mjs'))]"
      - name: Incremental build, first install and real workflows
        env:
          OMC_PREVIEW15_TRANSPORT_KEY: '${{ secrets.OMC_PREVIEW15_TRANSPORT_KEY }}'
          GH_TOKEN: '${{ github.token }}'
          PYTHONDONTWRITEBYTECODE: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: python native23/run-native.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: 'native23-${{ matrix.os }}-encrypted-evidence'
          path: |
            ${{ runner.temp }}/omc-native23/encrypted/reports.enc
            ${{ runner.temp }}/omc-native23/encrypted/REPORTS_READY.json
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: 'native23-${{ matrix.os }}-encrypted-package'
          path: |
            ${{ runner.temp }}/omc-native23/encrypted/package.enc
            ${{ runner.temp }}/omc-native23/encrypted/PACKAGE_READY.json
          retention-days: 7
          if-no-files-found: warn
