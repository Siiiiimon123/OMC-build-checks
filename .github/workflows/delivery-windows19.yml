name: Rewrap frozen Windows19 with one-installer scoped data key
'on':
  push:
    branches: ['verify-final-package19']
    paths: ['.github/workflows/delivery-windows19.yml', 'delivery-win19/**']
permissions: {contents: read, actions: read}
concurrency: {group: omc-win19-scoped-delivery, cancel-in-progress: false}
jobs:
  transfer:
    if: github.repository == 'Siiiiimon123/OMC-build-checks' && github.event.repository.private == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24.19.0', check-latest: false, package-manager-cache: false}
      - name: Authenticate unchanged installer and rewrap; no general key export
        env: {GH_TOKEN: '${{ github.token }}', OMC_PREVIEW15_TRANSPORT_KEY: '${{ secrets.OMC_PREVIEW15_TRANSPORT_KEY }}'}
        run: node delivery-win19/rewrap-windows-delivery19.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: win19-scoped-cipher-index
          path: '${{ runner.temp }}/omc-win19-scoped-delivery/INDEX.json'
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: win19-scoped-cipher-part-0
          path: '${{ runner.temp }}/omc-win19-scoped-delivery/part-000.bin'
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: win19-scoped-cipher-part-1
          path: '${{ runner.temp }}/omc-win19-scoped-delivery/part-001.bin'
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: win19-scoped-cipher-part-2
          path: '${{ runner.temp }}/omc-win19-scoped-delivery/part-002.bin'
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: win19-scoped-cipher-part-3
          path: '${{ runner.temp }}/omc-win19-scoped-delivery/part-003.bin'
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: win19-scoped-cipher-part-4
          path: '${{ runner.temp }}/omc-win19-scoped-delivery/part-004.bin'
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: win19-scoped-cipher-part-5
          path: '${{ runner.temp }}/omc-win19-scoped-delivery/part-005.bin'
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
