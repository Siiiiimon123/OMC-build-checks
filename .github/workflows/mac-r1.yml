name: Mac Preview18 R1 native build and acceptance (free)
'on':
  push:
    branches: ['verify-mac-r1-18']
    paths: ['.github/workflows/mac-r1.yml', 'mac-r1/**']
permissions: {contents: write}
concurrency: {group: omc-mac-r1-once, cancel-in-progress: false}
jobs:
  native:
    if: >-
      github.repository == 'Siiiiimon123/OMC-build-checks' && github.event.repository.private == false && github.ref == 'refs/heads/verify-mac-r1-18' && github.run_attempt == 1
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24.19.0', architecture: arm64, check-latest: false, package-manager-cache: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12.10', architecture: arm64, check-latest: false}
      - name: Authenticated inputs and native package acceptance
        env:
          OMC_PREVIEW15_TRANSPORT_KEY: '${{ secrets.OMC_PREVIEW15_TRANSPORT_KEY }}'
          GH_TOKEN: '${{ github.token }}'
          OMC_MAC_R1_AUTHORIZATION_ID: 'user-r1-completion-20261102'
        run: |
          set +x
          umask 077
          python mac-r1/final/run.py --execute --config mac-r1/final/CONFIG.json --config-sha256 0d4d6c0c91f98438b47388c4e68bcd78201c57aa7d0cc46da2af967f6cbf6f37
