name: Exact encrypted Mac Preview15 build
'on':
  push:
    branches: ['codex/mac-preview15-free-20261031']
    paths: ['.github/workflows/mac-free.yml', 'mac-free/**']
permissions: {contents: write}
concurrency: {group: omc-mac-preview15-free-once, cancel-in-progress: false}
jobs:
  native:
    if: >-
      github.repository == 'Siiiiimon123/OMC-build-checks' && github.event.repository.private == false && github.ref == 'refs/heads/codex/mac-preview15-free-20261031' && github.run_attempt == 1
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24.19.0', architecture: arm64, check-latest: false, package-manager-cache: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12.10', architecture: arm64, check-latest: false}
      - name: Authenticated inputs and native package acceptance
        env:
          OMC_PREVIEW15_TRANSPORT_KEY: '${{ secrets.OMC_PREVIEW15_TRANSPORT_KEY }}'
          GH_TOKEN: '${{ github.token }}'
        run: |
          set +x
          umask 077
          python mac-free/run.py
