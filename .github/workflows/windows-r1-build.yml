name: Windows R1 frozen build and first install acceptance
'on':
  push:
    branches: ['verify-windows-r1-18']
    paths: ['.github/workflows/windows-r1-build.yml', 'windows-r1/**']
permissions: {contents: write}
concurrency: {group: omc-windows-r1-once, cancel-in-progress: false}
jobs:
  native:
    if: >-
      github.repository == 'Siiiiimon123/OMC-build-checks' && github.event.repository.private == false && github.ref == 'refs/heads/verify-windows-r1-18' && github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24.19.0', architecture: x64, check-latest: false, package-manager-cache: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12.10', architecture: x64, check-latest: false}
      - name: Build and verify self-contained installed app
        env:
          OMC_PREVIEW15_TRANSPORT_KEY: '${{ secrets.OMC_PREVIEW15_TRANSPORT_KEY }}'
          GH_TOKEN: '${{ github.token }}'
          OMC_R1_AUTHORIZATION_ID: 'user-r1-execution-20261101'
          PYTHONDONTWRITEBYTECODE: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: python windows-r1/run-cloud.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-r1-encrypted-evidence
          path: |
            ${{ runner.temp }}/omc-r1-controller/encrypted/reports.enc
            ${{ runner.temp }}/omc-r1-controller/encrypted/REPORTS_READY.json
            ${{ runner.temp }}/omc-r1-controller/encrypted/OUTPUTS.json
          retention-days: 3
          if-no-files-found: warn
