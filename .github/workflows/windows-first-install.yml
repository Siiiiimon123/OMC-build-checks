name: Exact Windows installer first-install check
'on':
  push:
    branches: [main]
    paths: ['Verify-FirstInstall.ps1', '.github/workflows/windows-first-install.yml']
permissions: {contents: read}
jobs:
  first-install:
    if: github.repository == 'Siiiiimon123/OMC-build-checks' && github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1}
      - name: Download and verify the exact member installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installer=Join-Path $env:RUNNER_TEMP 'OMC-Preview15-Setup.exe'
          Invoke-WebRequest -Uri 'https://omc.xiaoa.cyou/updates/targets/releases/89a6740289055de73b7d8ec375020fdffe134930debbe0b4f64cea5dc4d9a5d8.OMC-Photo-Select-1.0.21-preview.15-x64.exe' -OutFile $installer -TimeoutSec 2100
          & ./Verify-FirstInstall.ps1 -Installer $installer -InstallerSha256 '89a6740289055de73b7d8ec375020fdffe134930debbe0b4f64cea5dc4d9a5d8' -AppAsarSha256 '2eaf3864ab09b777a25da10c083c3ca90ed4904bbb661143c6e8b85c4054b193'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Windows-first-install-result
          path: ${{ runner.temp }}/omc-first-install-report.json
          retention-days: 1
          if-no-files-found: warn
