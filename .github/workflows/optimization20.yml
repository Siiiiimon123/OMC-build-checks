name: R20 targeted product regression
'on':
  push:
    branches: ['verify-optimization20']
    paths: ['.github/workflows/optimization20.yml', 'opt20/**']
permissions: {contents: read, actions: read}
concurrency: {group: omc-optimization20-timing, cancel-in-progress: true}
jobs:
  regression:
    if: github.repository == 'Siiiiimon123/OMC-build-checks' && github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, arch: x64}
    runs-on: '${{ matrix.os }}'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24.19.0', architecture: '${{ matrix.arch }}', check-latest: false, package-manager-cache: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12.10', architecture: '${{ matrix.arch }}', check-latest: false}
      - name: Product regression without rebuilding installed runtimes
        env:
          OMC_PREVIEW15_TRANSPORT_KEY: '${{ secrets.OMC_PREVIEW15_TRANSPORT_KEY }}'
          PYTHONDONTWRITEBYTECODE: '1'
          OMC_R20_NATIVE_UI: '0'
          OMC_R20_ENGINE_BASELINE: '0'
          OMC_R20_CHANGED_BATCHER: '0'
          OMC_R20_SOURCE_GUARDS_ONLY: '1'
          OMC_R20_COMMIT_WAVE: '0'
          OMC_R21_INCREMENTAL: '0'
          OMC_R22_NEUTRAL_DISPLAY: '0'
          OMC_R23_TECHNICAL_AND_PREVIEW: '1'
          OMC_R20_TIMING_ONLY: '1'
          OMC_R20_FAST_DISPLAY: '1'
          OMC_R20_FINISHED_FLOW: '0'
          GH_TOKEN: '${{ github.token }}'
        run: python opt20/run-cloud.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: 'optimization20-${{ matrix.os }}-encrypted-evidence'
          path: |
            ${{ runner.temp }}/omc-optimization-r20/encrypted/reports.enc
            ${{ runner.temp }}/omc-optimization-r20/encrypted/REPORTS_READY.json
          retention-days: 7
          if-no-files-found: warn
