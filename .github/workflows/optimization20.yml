name: Current exact source browser build completion only
'on':
  push:
    branches: ['verify-optimization20']
    paths: ['final21/**', '.github/workflows/optimization20.yml']
permissions: {contents: read}
jobs:
  source-contracts:
    if: github.repository == 'Siiiiimon123/OMC-build-checks' && github.event.repository.private == false && github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24.19.0', architecture: x64, check-latest: false, package-manager-cache: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12.10', architecture: x64, check-latest: false}
      - name: Parse control before use
        run: python -c "import ast,pathlib;ast.parse(pathlib.Path('final21/run-source-build-only.py').read_text(encoding='utf8'))"
      - name: Verify encrypted source and run regression contracts
        env:
          OMC_PREVIEW15_TRANSPORT_KEY: '${{ secrets.OMC_PREVIEW15_TRANSPORT_KEY }}'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python final21/run-source-build-only.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: current-source-core-browser-encrypted-evidence
          path: |
            ${{ runner.temp }}/omc-current-source21/encrypted/reports.enc
            ${{ runner.temp }}/omc-current-source21/encrypted/REPORTS_READY.json
          retention-days: 7
          if-no-files-found: warn
