name: Resume the existing Mac Preview24 ciphertext
'on':
  push:
    branches: ['verify-update24-mac-resume']
    paths: ['update24/resume-reference24.cjs', '.github/workflows/update24-mac-resume.yml']
permissions: {contents: read, actions: read}
jobs:
  reference:
    if: github.repository == 'Siiiiimon123/OMC-build-checks' && github.event.repository.private == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24.19.0', architecture: x64, check-latest: false, package-manager-cache: false}
      - name: Encrypt read-only locator for the exact existing ciphertext
        env:
          OMC_PREVIEW15_TRANSPORT_KEY: '${{ secrets.OMC_PREVIEW15_TRANSPORT_KEY }}'
          GH_TOKEN: '${{ github.token }}'
        run: node update24/resume-reference24.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mac24-resume-reference
          path: |
            ${{ runner.temp }}/mac24-resume-reference/REFERENCE_READY.json
            ${{ runner.temp }}/mac24-resume-reference/ref.enc
          retention-days: 1
          if-no-files-found: error
