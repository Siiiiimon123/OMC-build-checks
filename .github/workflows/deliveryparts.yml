name: Existing Windows21 encrypted artifact delivery fragments
'on':
  push:
    branches: ['verify-optimization20']
    paths: ['deliveryparts/**', '.github/workflows/deliveryparts.yml']
permissions: {contents: read, actions: read}
jobs:
  transfer:
    if: github.repository == 'Siiiiimon123/OMC-build-checks' && github.event.repository.private == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24.19.0', check-latest: false, package-manager-cache: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12.10', check-latest: false}
      - name: Split exact existing ciphertext only
        env:
          GH_TOKEN: '${{ github.token }}'
        run: python deliveryparts/split.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows21-delivery-part000
          path: '${{ runner.temp }}/omc-delivery-parts21/parts/part000.enc'
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows21-delivery-part001
          path: '${{ runner.temp }}/omc-delivery-parts21/parts/part001.enc'
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows21-delivery-parts-metadata
          path: |
            ${{ runner.temp }}/omc-delivery-parts21/parts/DELIVERY_PARTS.json
            ${{ runner.temp }}/omc-delivery-parts21/parts/PACKAGE_READY.json
          retention-days: 7
          if-no-files-found: error
