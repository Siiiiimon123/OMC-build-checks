name: OMC candidate native upgrade verification
'on':
  push:
    branches: ['verify-native-candidate']
    paths: ['candidate-native/**', '.github/workflows/native-candidate.yml']
permissions: {contents: read, actions: read}
jobs:
  candidate-native:
    if: github.repository == 'Siiiiimon123/OMC-build-checks' && github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, arch: x64, platform: windows}
          - {os: macos-15, arch: arm64, platform: mac}
    runs-on: '${{ matrix.os }}'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1, path: controls}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: '6d5f3540d0e27e57c89423536bb3bf0cc774e528'
          path: history
          sparse-checkout: |
            final19
            opt20
            native23
            probability23
            update24
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24.19.0', architecture: '${{ matrix.arch }}', check-latest: false, package-manager-cache: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12.10', architecture: '${{ matrix.arch }}', check-latest: false}
      - name: Recover versioned candidate source
        env:
          OMC_PREVIEW15_TRANSPORT_KEY: '${{ secrets.OMC_PREVIEW15_TRANSPORT_KEY }}'
        run: python -B controls/candidate-native/stage-candidate-native-inputs.py node history controls/candidate-native/capsule controls/candidate-native/build-controls "${{ runner.temp }}/omc-candidate-inputs" '${{ matrix.platform }}'
      - name: Build candidate and exercise the installed upgrade
        env:
          OMC_PREVIEW15_TRANSPORT_KEY: '${{ secrets.OMC_PREVIEW15_TRANSPORT_KEY }}'
          GH_TOKEN: '${{ github.token }}'
        run: python -B controls/candidate-native/run-candidate-native.py "${{ runner.temp }}/omc-candidate-inputs" b166fc6154b7433cb161e8b1e746a9c3b415abb9294f2ab280b51882ee041bea
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: 'candidate-native-${{ matrix.os }}'
          path: |
            ${{ runner.temp }}/omc-candidate-inputs/STAGED.json
            ${{ runner.temp }}/omc-native-candidate/usage/BASELINE.json
          retention-days: 7
          if-no-files-found: warn
