name: Final19 native packaging and installed acceptance
'on':
  push:
    branches: ['verify-final-package19']
    paths: ['.github/workflows/final-package19.yml', 'final19/**']
permissions: {contents: read}
jobs:
  native:
    if: github.repository == 'Siiiiimon123/OMC-build-checks' && github.event.repository.private == false && github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, arch: x64, python: '3.14.5'}
    concurrency: {group: 'omc-final-package19-${{ matrix.os }}', cancel-in-progress: false}
    runs-on: '${{ matrix.os }}'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24.19.0', architecture: '${{ matrix.arch }}', check-latest: false, package-manager-cache: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '${{ matrix.python }}', architecture: '${{ matrix.arch }}', check-latest: false}
      - name: Validate controller syntax before dependency downloads
        run: python final19/run-final-package-cloud.py --preflight
      - name: Build exact native installer and verify installed App
        env:
          OMC_PREVIEW15_TRANSPORT_KEY: '${{ secrets.OMC_PREVIEW15_TRANSPORT_KEY }}'
          PYTHONDONTWRITEBYTECODE: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: python final19/run-final-package-cloud.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: 'final19-${{ matrix.os }}-encrypted-evidence'
          path: |
            ${{ runner.temp }}/omc-final-package19/encrypted/reports.enc
            ${{ runner.temp }}/omc-final-package19/encrypted/REPORTS_READY.json
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: 'final19-${{ matrix.os }}-encrypted-package'
          path: |
            ${{ runner.temp }}/omc-final-package19/encrypted/package.enc
            ${{ runner.temp }}/omc-final-package19/encrypted/PACKAGE_READY.json
          retention-days: 7
          if-no-files-found: warn
